<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Board</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #2f6fde; --accent-text: #ffffff; --accent-soft: #e7efff;
    --ok: #1d7f4e; --ok-soft: #e3f4ea; --warn: #9a6200; --warn-soft: #fdf1dc;
    --bad: #b3261e; --bad-soft: #fbe6e4; --gray-soft: #eef0f3;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1f25; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b323b;
      --accent: #6b9cff; --accent-text: #0b1020; --accent-soft: #1d2a44;
      --ok: #5fcf95; --ok-soft: #173326; --warn: #e5b45a; --warn-soft: #3a2d14;
      --bad: #ff8a80; --bad-soft: #3d1c1a; --gray-soft: #232a32; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1f25; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b323b;
    --accent: #6b9cff; --accent-text: #0b1020; --accent-soft: #1d2a44;
    --ok: #5fcf95; --ok-soft: #173326; --warn: #e5b45a; --warn-soft: #3a2d14;
    --bad: #ff8a80; --bad-soft: #3d1c1a; --gray-soft: #232a32; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.ghost { border-color: transparent; background: transparent; padding: 4px 8px; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=search], select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { min-width: 0; flex: 1 1 220px; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    aside { order: -1; position: static; }
  }
  @media (max-width: 560px) {
    input[type=search] { flex-basis: 100%; }
    select { flex: 1 1 0; min-width: 0; }
    header { position: static; }
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { border-radius: 999px; padding: 5px 12px; }
  .tab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .tab .n { color: var(--muted); margin-left: 4px; }
  .notice { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; font-size: 13px; }
  .bulk { display: none; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); }
  .bulk.show { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
  .card.selected { border-color: var(--accent); }
  .card input[type=checkbox] { margin-top: 4px; width: 16px; height: 16px; }
  .title { font-weight: 600; font-size: 15px; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: 13px; display: flex; gap: 6px 12px; flex-wrap: wrap; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
  .pill.new { background: var(--accent-soft); color: var(--accent); }
  .pill.selected, .pill.applying { background: var(--accent); color: var(--accent-text); }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.wait { background: var(--warn-soft); color: var(--warn); }
  .pill.skip { background: var(--gray-soft); color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 8px; margin: 8px 0 2px; }
  .fact { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--gray-soft); min-width: 0; }
  .fact .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .fact .v { display: block; font-size: 14px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .fact .v.none { font-weight: 400; color: var(--muted); }
  .fact .lvl { font-size: 12px; color: var(--muted); }
  .fact.fit { background: var(--ok-soft); border-color: transparent; } .fact.fit .v { color: var(--ok); }
  .fact.stretch { background: var(--warn-soft); border-color: transparent; } .fact.stretch .v { color: var(--warn); }
  .fact.senior { background: var(--bad-soft); border-color: transparent; } .fact.senior .v { color: var(--bad); }
  @media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .desc { color: var(--text); font-size: 13px; margin: 6px 0 2px; overflow-wrap: anywhere; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lognote { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .actions a { color: var(--accent); font-size: 13px; align-self: center; }
  .actions a.btn-link { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-weight: 600; }
  aside { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside p { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  ol.queue { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; }
  ol.queue li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  ol.queue li:first-child { border-top: 0; }
  .qn { color: var(--muted); font-size: 12px; text-align: right; }
  .qt { font-size: 13px; overflow-wrap: anywhere; }
  .qt small { display: block; color: var(--muted); }
  .qb { display: flex; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); }
  label.inline { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  label.inline[hidden] { display: none; }
  .filters-bar { padding-top: 0; }
  details.filters { width: 100%; font-size: 13px; }
  details.filters summary { cursor: pointer; color: var(--muted); }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 16px; margin: 8px 0 4px; }
  .filter-grid label { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .filter-grid .n { color: var(--muted); margin-left: auto; }
  .filter-actions { display: flex; gap: 4px; }
  .flagnote { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .hidden-note { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); padding: 0; width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
  .dlg-head { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { font-size: 17px; margin: 0 0 4px; }
  .dlg-head p { color: var(--muted); font-size: 13px; margin: 0; }
  .dlg-body { padding: 14px 20px; overflow: auto; }
  .dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dlg-foot .meta { flex: 1; }
  .drop { border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px; text-align: center; }
  .drop input[type=file] { margin-top: 10px; }
  .ans-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .ans-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line); align-items: start; }
  .ans-row label { font-size: 13px; overflow-wrap: anywhere; text-align: left; padding-top: 6px; }
  .dlg-body { text-align: left; }
  .ans-row label .tag { font-size: 11px; color: var(--warn); margin-left: 6px; }
  .ans-row textarea { width: 100%; min-height: 34px; resize: vertical; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .ans-row.empty textarea { border-color: var(--warn); }
  @media (max-width: 640px) { .ans-row { grid-template-columns: minmax(0, 1fr); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Job Board</h1>
    <span class="meta" id="meta">Loading…</span>
    <span class="spacer"></span>
    <button class="primary" data-search="google" title="Claude searches Google Jobs in a new Chrome tab and adds about 10 candidates here">Search Google Jobs</button>
    <button id="answersBtn" title="Upload your resume and review the answers Claude uses on application forms">Update my answers</button>
    <button class="primary" data-search="linkedin" title="Claude searches LinkedIn in a new Chrome tab and adds about 10 candidates here">Search LinkedIn</button>
  </div>
  <div class="bar" style="padding-top:0">
    <label class="sr" for="q">Search</label>
    <input type="search" id="q" placeholder="Search title, company, location, description">
    <label class="sr" for="sort">Sort</label>
    <select id="sort">
      <option value="posted">Newest posted</option>
      <option value="company">Company</option>
      <option value="title">Title</option>
      <option value="location">Location</option>
    </select>
    <label class="sr" for="source">Source</label>
    <select id="source"><option value="">All sources</option></select>
    <label class="sr" for="area">Location</label>
    <select id="area"><option value="">Any location</option></select>
    <label class="sr" for="pay">Salary range</label>
    <select id="pay">
      <option value="">Any salary</option>
      <option value="listed">Salary listed</option>
      <option value="50000">$50K+</option>
      <option value="75000">$75K+</option>
      <option value="100000">$100K+</option>
      <option value="125000">$125K+</option>
      <option value="150000">$150K+</option>
      <option value="200000">$200K+</option>
    </select>
    <label class="inline" id="payNoneWrap" hidden><input type="checkbox" id="payNone" checked> include not listed</label>
  </div>
  <div class="bar filters-bar">
    <details class="filters" id="filtersBox">
      <summary>Hide jobs that fail a filter <span class="meta" id="filtersOn"></span></summary>
      <div class="filter-grid" id="filters"></div>
      <div class="filter-actions">
        <button class="ghost" id="filtersAll">Check all</button>
        <button class="ghost" id="filtersNone">Clear all</button>
      </div>
    </details>
  </div>
</header>

<main>
  <section aria-label="Jobs">
    <div class="tabs" id="tabs" role="toolbar" aria-label="Status filter"></div>
    <div id="notice" class="notice" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="searchStatus" class="notice" hidden></div>
    <div class="bulk" id="bulk">
      <strong id="bulkN"></strong>
      <button id="bulkSelect" class="primary">Add to apply queue</button>
      <button id="bulkSkip">Skip</button>
      <button id="bulkClear" class="ghost">Clear</button>
    </div>
    <div id="list"></div>
  </section>

  <aside aria-label="Apply queue">
    <h2>Apply queue <span class="meta" id="qcount"></span></h2>
    <p id="qhelp">Claude applies to these jobs in this order at the next round. To start sooner, tell Claude “apply my selected jobs”.</p>
    <ol class="queue" id="queue"></ol>
  </aside>
</main>

<dialog id="ansDlg" aria-labelledby="ansTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="ansTitle">Update my answers</h2>
      <p id="ansSub"></p>
    </div>
    <div class="dlg-body" id="ansBody"></div>
    <div class="dlg-foot">
      <span class="meta" id="ansStatus"></span>
      <button id="ansBack" class="ghost" hidden>Upload a resume</button>
      <button id="ansSkip" class="ghost">Skip - edit answers now</button>
      <button id="ansClose">Close</button>
      <button id="ansSave" class="primary" hidden>Save answers</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
const GROUPS = [
  { id: "review", label: "To review", match: s => s === "new" },
  { id: "queue", label: "Apply queue", match: s => s === "selected" || s === "applying" },
  { id: "waiting", label: "Waiting on you", match: s => ["Needs User", "Needs approval", "Pending", "Candidate", "Approved"].includes(s) },
  { id: "done", label: "Submitted", match: s => s === "Submitted" },
  { id: "skipped", label: "Skipped", match: s => s === "skipped" || s === "Skipped" },
  { id: "all", label: "All", match: () => true },
];
const state = { jobs: [], tab: "review", checked: new Set(), expanded: new Set(), expLimits: { max: 2, stretchAt: 3 },
                filters: [], areas: [], hide: new Set() };
const $ = id => document.getElementById(id);
const PREFS = "jobboard.filters";  // this browser only: hidden filters, location, salary
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS) || "{}");
    state.hide = new Set(p.hide || []);
    state.area = p.area || ""; $("pay").value = p.pay || ""; $("payNone").checked = p.payNone !== false;
  } catch (e) { /* storage blocked: defaults */ }
}
function savePrefs() {
  try {
    localStorage.setItem(PREFS, JSON.stringify({ hide: [...state.hide], area: $("area").value, pay: $("pay").value,
                                                 payNone: $("payNone").checked }));
  } catch (e) { /* storage blocked: choices last until reload */ }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
function ago(iso) {
  if (!iso) return "date unknown";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return `${m}m ago`;
  if (m < 48 * 60) return `${Math.floor(m / 60)}h ago`;
  return `${Math.floor(m / 1440)}d ago`;
}
function pillClass(s) {
  if (s === "new") return "new";
  if (s === "selected" || s === "applying") return s;
  if (s === "Submitted") return "done";
  if (s === "skipped" || s === "Skipped") return "skip";
  return "wait";
}
function pillText(s) {
  return { new: "New", selected: "In queue", applying: "Applying now", skipped: "Skipped by you" }[s] || s;
}

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
function showError(msg) { const e = $("error"); e.textContent = msg; e.hidden = !msg; }

function apply(data) {
  if (data.experienceYears) state.expLimits = data.experienceYears;
  state.jobs = data.jobs || [];
  const keys = new Set(state.jobs.map(j => j.key));
  state.checked.forEach(k => { if (!keys.has(k)) state.checked.delete(k); });
  $("meta").textContent = `${state.jobs.length} jobs on the board`;
  showSearches(data.searchRequests || []);
  state.profile = data.profileRequest || null;
  if ($("ansDlg").open && state.ansStep === "wait") showResumeWait();
  const every = data.queueCheckSeconds;
  $("qhelp").textContent = every
    ? `While Claude's job-search session is running, it starts on these jobs within seconds of adding them, in this order, ` +
      `in a new Chrome tab per job. Jobs that need you (sign-in, CAPTCHA, unknown question) move to “Waiting on you” with their tab left open.`
    : "Claude applies to these jobs in this order at the next round. To start sooner, tell Claude “apply my selected jobs”.";
  const n = $("notice");
  n.hidden = data.requireSelection !== false;
  n.textContent = "jobBoard.requireSelection is off: Claude also applies to clear matches you have not selected. Jobs you skip here are never applied to.";
  const sources = [...new Set(state.jobs.map(j => j.source).filter(Boolean))].sort();
  const sel = $("source"), cur = sel.value;
  sel.innerHTML = '<option value="">All sources</option>' + sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  sel.value = sources.includes(cur) ? cur : "";
  state.filters = data.filters || [];
  state.areas = data.areas || [];
  const ar = $("area"), curArea = ar.value || state.area || "";
  ar.innerHTML = '<option value="">Any location</option>' + state.areas.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("") +
    '<option value="~other">Other locations</option>';
  ar.value = [...state.areas, "~other"].includes(curArea) ? curArea : "";
  render();
}

// Search buttons: the request goes to Claude's session (queue watcher); Claude searches in Chrome and adds candidates here.
const SOURCES = { google: "Google Jobs", linkedin: "LinkedIn" };
function showSearches(reqs) {
  const open = reqs.filter(r => r.status === "requested" || r.status === "running");
  document.querySelectorAll("[data-search]").forEach(b => {
    b.disabled = open.some(r => r.source === b.dataset.search);
  });
  const last = reqs[reqs.length - 1];
  const el = $("searchStatus");
  let msg = "";
  if (open.length) {
    msg = open.map(r => r.status === "running"
      ? `Claude is searching ${SOURCES[r.source]} in Chrome${r.note ? " - " + r.note : ""}…`
      : `Waiting for Claude to start the ${SOURCES[r.source]} search (requested ${ago(r.requestedAt)})` +
        (Date.now() - new Date(r.requestedAt).getTime() > 3 * 60000 ? " - is Claude's job-search session running?" : "") + "…").join(" ");
  } else if (last && Date.now() - new Date(last.doneAt || last.failedAt || last.requestedAt).getTime() < 30 * 60000) {
    msg = last.status === "done"
      ? `${SOURCES[last.source]} search done: ${last.found ?? 0} new candidates added${last.note ? " - " + last.note : ""}. Approve with Add to apply queue.`
      : `${SOURCES[last.source]} search failed${last.note ? ": " + last.note : ""}.`;
  }
  el.textContent = msg;
  el.hidden = !msg;
}
async function requestSearch(source) {
  try { apply(await api("/api/search", { source })); showError(""); }
  catch (e) { showError("Could not send the search request: " + e.message); }
}

function filtered() {
  const g = GROUPS.find(x => x.id === state.tab);
  const q = $("q").value.trim().toLowerCase();
  const src = $("source").value;
  let list = state.jobs.filter(j => g.match(j.status) && (!src || j.source === src));
  if (q) list = list.filter(j => [j.title, j.company, j.location, j.description].join(" ").toLowerCase().includes(q));
  const before = list.length;
  list = list.filter(passes);
  state.hiddenCount = before - list.length;
  const by = $("sort").value;
  const cmp = {
    posted: (a, b) => (b.posted || "").localeCompare(a.posted || ""),
    company: (a, b) => (a.company || "").localeCompare(b.company || "") || (a.title || "").localeCompare(b.title || ""),
    title: (a, b) => (a.title || "").localeCompare(b.title || ""),
    location: (a, b) => (a.location || "").localeCompare(b.location || ""),
  }[by];
  return list.sort(cmp);
}

// location / salary dropdowns and the "hide jobs that fail a filter" checkboxes
function passes(j) {
  const area = $("area").value, pay = $("pay").value;
  if (area === "~other" ? (j.areas || []).length : area && !(j.areas || []).includes(area)) return false;
  if (pay === "listed" && j.payMax == null) return false;
  if (pay && pay !== "listed" && (j.payMax == null ? !$("payNone").checked : j.payMax < Number(pay))) return false;
  return !(j.flags || []).some(f => state.hide.has(f));
}

function renderFilters() {
  const counts = {};
  state.jobs.forEach(j => (j.flags || []).forEach(f => { counts[f] = (counts[f] || 0) + 1; }));
  $("filters").innerHTML = state.filters.map(f => `
    <label title="From ${esc(f.rule)}"><input type="checkbox" data-filter="${esc(f.id)}" ${state.hide.has(f.id) ? "checked" : ""}>
      <span>${esc(f.label)}</span><span class="n">${counts[f.id] || 0}</span></label>`).join("");
  $("filtersOn").textContent = state.hide.size ? `· ${state.hide.size} on` : "";
  $("payNoneWrap").hidden = !$("pay").value || $("pay").value === "listed";
}

function render() {
  renderFilters();
  $("tabs").innerHTML = GROUPS.map(g => {
    const n = state.jobs.filter(j => g.match(j.status)).length;
    return `<button class="tab" data-tab="${g.id}" aria-pressed="${g.id === state.tab}">${g.label}<span class="n">${n}</span></button>`;
  }).join("");

  const list = filtered();
  if (!state.jobs.length) {
    $("list").innerHTML = `<div class="empty">No jobs on the board yet.<br>Click <b>Search Google Jobs</b> or <b>Search LinkedIn</b> - Claude finds about 10 candidates for you to approve.</div>`;
  } else if (!list.length) {
    const msg = state.hiddenCount ? `All ${state.hiddenCount} jobs in this view are hidden by your location / salary / filter choices.`
      : state.tab === "review" ? "Nothing new to review. Click a search button for new candidates." : "No jobs in this view.";
    $("list").innerHTML = `<div class="empty">${msg}</div>`;
  } else {
    $("list").innerHTML = (state.hiddenCount ? `<div class="hidden-note">${state.hiddenCount} hidden by your location / salary / filter choices</div>` : "")
      + list.map(card).join("");
  }

  const q = state.jobs.filter(j => j.status === "selected" || j.status === "applying")
    .sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
  $("qcount").textContent = q.length ? `· ${q.length}` : "";
  $("queue").innerHTML = q.length ? q.map((j, i) => `
    <li>
      <span class="qn">${i + 1}.</span>
      <span class="qt">${esc(j.title)}<small>${esc(j.company)}${j.status === "applying" ? " · applying now" : ""}</small></span>
      <span class="qb">
        <button class="ghost" data-act="up" data-key="${esc(j.key)}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="ghost" data-act="down" data-key="${esc(j.key)}" aria-label="Move down" ${i === q.length - 1 ? "disabled" : ""}>↓</button>
        <button class="ghost" data-act="new" data-key="${esc(j.key)}" aria-label="Remove from queue">✕</button>
      </span>
    </li>`).join("") : `<li style="display:block;color:var(--muted);font-size:13px">No jobs selected. Use <b>Add to apply queue</b> on a job.</li>`;

  const n = state.checked.size;
  $("bulk").classList.toggle("show", n > 0);
  $("bulkN").textContent = `${n} checked`;
}

function facts(j) {
  const e = j.experience || {}, lim = state.expLimits;
  const fit = e.years == null ? "" : e.years <= lim.max ? "fit" : e.years <= lim.stretchAt ? "stretch" : "senior";
  const fitText = { fit: "fits your range", stretch: "stretch", senior: "too senior" }[fit] || "";
  const level = [e.level, fitText].filter(Boolean).join(" · ");
  return `<div class="facts">
      <div class="fact"><span class="k">Salary</span>
        <span class="v ${j.salary ? "" : "none"}">${esc(j.salary || "Not listed")}</span></div>
      <div class="fact ${fit}" title="Required experience from the job description; colour vs experienceYears in your config">
        <span class="k">Experience</span>
        <span class="v ${e.text ? "" : "none"}">${esc(e.text || "Not stated")}</span>
        ${level ? `<span class="lvl">${esc(level)}</span>` : ""}</div>
      <div class="fact"><span class="k">Work mode</span>
        <span class="v ${j.workMode ? "" : "none"}">${esc(j.workMode || "Not stated")}</span></div>
    </div>`;
}

function card(j) {
  const s = j.status, k = esc(j.key);
  const posting = safeUrl(j.url), applyUrl = safeUrl(j.applyUrl);
  const open = state.expanded.has(j.key);
  const desc = j.description ? `<div class="desc ${open ? "" : "clamp"}">${esc(j.description)}</div>
      ${j.description.length > 280 ? `<button class="ghost" data-act="more" data-key="${k}">${open ? "Show less" : "Show more"}</button>` : ""}` : "";
  const canChoose = s === "new" || s === "selected" || s === "skipped";
  const buttons = [];
  if (s === "new" || s === "skipped") buttons.push(`<button class="primary" data-act="selected" data-key="${k}">Add to apply queue</button>`);
  if (s === "selected") buttons.push(`<button data-act="new" data-key="${k}">Remove from queue</button>`);
  if (s === "new" || s === "selected") buttons.push(`<button data-act="skipped" data-key="${k}">Skip</button>`);
  if (s === "skipped") buttons.push(`<button data-act="new" data-key="${k}">Undo skip</button>`);
  if (["Needs approval", "Pending", "Candidate", "Approved"].includes(s))  // failed a rule: apply anyway
    buttons.push(`<button class="primary" data-act="approve" data-key="${k}" title="Put it back in the apply queue - Claude applies even though it failed a rule">Approve &amp; apply</button>`);
  if (["Needs User", "Needs approval", "Pending", "Candidate", "Approved"].includes(s)) {
    buttons.push(`<button data-act="submitted" data-key="${k}" title="You submitted this application yourself - log it as Submitted">Mark as submitted</button>`);
    buttons.push(`<button data-act="skipwaiting" data-key="${k}" title="Don't apply - log it as Skipped">Skip</button>`);
  }
  if (s === "Needs User")  // back to the end of the apply queue; Claude continues in the tab it left open
    buttons.push(`<button data-act="continue" data-key="${k}" title="Back to the end of the apply queue - Claude finishes it in the tab it left open">Continue application</button>`);
  if (posting) buttons.push(`<a href="${esc(posting)}" target="_blank" rel="noopener noreferrer">Open posting ↗</a>`);
  if (applyUrl && applyUrl !== posting) buttons.push(`<a href="${esc(applyUrl)}" target="_blank" rel="noopener noreferrer">Apply page ↗</a>`);
  const via = j.direct === false && j.publisher ? `via ${esc(j.publisher)}` : "";
  return `
    <article class="card ${s === "selected" || s === "applying" ? "selected" : ""}">
      <input type="checkbox" data-check="${k}" aria-label="Check ${esc(j.title)}" ${state.checked.has(j.key) ? "checked" : ""} ${canChoose ? "" : "disabled"}>
      <div>
        <div class="row">
          ${posting ? `<a class="title" href="${esc(posting)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>` : `<span class="title">${esc(j.title)}</span>`}
          <span class="pill ${pillClass(s)}">${esc(pillText(s))}</span>
        </div>
        <div class="sub">
          <span><b>${esc(j.company)}</b></span>
          <span>${esc(j.location || "location not given")}${j.remote ? " · remote" : ""}${j.checkLocation ? " · check location" : ""}</span>
          <span>${esc(ago(j.posted))}</span>
          <span>${esc(j.source)}${via ? " · " + via : ""}</span>
        </div>
        ${facts(j)}
        ${desc}
        ${(j.flags || []).length ? `<div class="flagnote">Fails filter: ${esc(j.flags.map(f => (state.filters.find(x => x.id === f) || { label: f }).label).join(" · "))}</div>` : ""}
        ${j.logNotes ? `<div class="lognote">${s === "Needs User" ? "Needs you" : "Log"} (${esc(j.logDate)}): ${esc(j.logNotes)}</div>` : ""}
        <div class="actions">${buttons.join("")}</div>
      </div>
    </article>`;
}

async function waitingAction(key, action, btn) {
  btn.disabled = true;
  try { apply(await api("/api/waiting", { key, action })); showError(""); }
  catch (e) { btn.disabled = false; showError("Could not update the job: " + e.message); }
}

async function choose(keys, choice) {
  try { const r = await api("/api/choice", { keys, choice }); showError(""); apply(r); }
  catch (e) { showError("Could not save your choice: " + e.message + ". Is the job board server still running?"); }
}
async function move(key, dir) {
  const q = state.jobs.filter(j => j.status === "selected" || j.status === "applying").sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9)).map(j => j.key);
  const i = q.indexOf(key), t = i + dir;
  if (i < 0 || t < 0 || t >= q.length) return;
  [q[i], q[t]] = [q[t], q[i]];
  try { apply(await api("/api/order", { keys: q })); } catch (e) { showError("Could not reorder: " + e.message); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  const act = t.dataset.act, key = t.dataset.key;
  if (act === "more") { state.expanded.has(key) ? state.expanded.delete(key) : state.expanded.add(key); render(); }
  else if (act === "up") move(key, -1);
  else if (act === "down") move(key, 1);
  else if (["selected", "skipped", "new"].includes(act)) { state.checked.delete(key); choose([key], act); }
  else if (act === "submitted") waitingAction(key, "submitted", t);
  else if (act === "skipwaiting") waitingAction(key, "skipped", t);
  else if (act === "approve") waitingAction(key, "approve", t);
  else if (act === "continue") waitingAction(key, "continue", t);
});
document.addEventListener("change", e => {
  const f = e.target.dataset && e.target.dataset.filter;
  if (f !== undefined) { e.target.checked ? state.hide.add(f) : state.hide.delete(f); savePrefs(); render(); return; }
  const k = e.target.dataset && e.target.dataset.check;
  if (k === undefined) return;
  e.target.checked ? state.checked.add(k) : state.checked.delete(k);
  render();
});
$("bulkSelect").onclick = () => { const k = [...state.checked]; state.checked.clear(); choose(k, "selected"); };
$("bulkSkip").onclick = () => { const k = [...state.checked]; state.checked.clear(); choose(k, "skipped"); };
$("bulkClear").onclick = () => { state.checked.clear(); render(); };
["q", "sort", "source"].forEach(id => $(id).addEventListener("input", render));
["area", "pay", "payNone"].forEach(id => $(id).addEventListener("input", () => { savePrefs(); render(); }));
$("filtersAll").onclick = () => { state.filters.forEach(f => state.hide.add(f.id)); savePrefs(); render(); };
$("filtersNone").onclick = () => { state.hide.clear(); savePrefs(); render(); };
loadPrefs();

document.querySelectorAll("[data-search]").forEach(b => { b.onclick = () => requestSearch(b.dataset.search); });

// ---- Update my answers: 1) upload a resume (Claude reads it and fills what it can), 2) fill in the rest ----
function openAnswers() {
  const p = state.profile;
  if (p && (p.status === "requested" || p.status === "running")) { state.ansStep = "wait"; showResumeWait(); }
  else showResumeStep();
  if (!$("ansDlg").open) $("ansDlg").showModal();
}
function ansButtons(step) {
  state.ansStep = step;
  $("ansSave").hidden = step !== "form";
  $("ansBack").hidden = step !== "form";
  $("ansSkip").hidden = step === "form";
  $("ansSkip").textContent = step === "wait" ? "Don't wait - edit answers now" : "Skip - edit answers now";
}
function showResumeStep() {
  ansButtons("upload");
  $("ansSub").textContent = "Step 1 of 2 - upload your resume. Claude reads it, updates your resume data and fills in every answer it can.";
  $("ansStatus").textContent = "";
  $("ansBody").innerHTML = `<div class="drop">
      <div><b>Upload your resume</b> (PDF, DOCX, DOC or TXT, up to 5 MB)</div>
      <input type="file" id="resumeFile" accept=".pdf,.docx,.doc,.txt">
      <div style="margin-top:12px"><button class="primary" id="resumeUpload" disabled>Upload resume</button></div>
      <p class="meta" style="margin-top:12px">The file stays on this PC (private/uploads). Claude's job-search session must be running to read it.</p>
    </div>`;
  $("resumeFile").onchange = () => { $("resumeUpload").disabled = !$("resumeFile").files.length; };
  $("resumeUpload").onclick = uploadResume;
}
async function uploadResume() {
  const f = $("resumeFile").files[0];
  if (!f) return;
  if (f.size > 5 * 1024 * 1024) { $("ansStatus").textContent = "That file is over 5 MB."; return; }
  $("resumeUpload").disabled = true;
  $("ansStatus").textContent = "Uploading…";
  const data = await new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(r.error);
    r.readAsDataURL(f);
  });
  try {
    apply(await api("/api/resume", { name: f.name, data }));
    state.ansStep = "wait";
    showResumeWait();
  } catch (e) {
    $("ansStatus").textContent = "Upload failed: " + e.message;
    $("resumeUpload").disabled = false;
  }
}
function showResumeWait() {
  const p = state.profile;
  if (p && p.status === "done") { showAnswerForm(p.note ? "Claude read your resume: " + p.note : "Claude read your resume and filled in what it could."); return; }
  if (p && p.status === "failed") { showAnswerForm("Claude could not read the resume" + (p.note ? ": " + p.note : "") + ". Fill in the answers below."); return; }
  ansButtons("wait");
  $("ansSub").textContent = "Step 1 of 2 - Claude is reading your resume.";
  const late = p && Date.now() - new Date(p.requestedAt).getTime() > 3 * 60000;
  $("ansBody").innerHTML = `<div class="drop"><b>${p && p.status === "running" ? "Claude is reading your resume and filling in your answers…" : "Waiting for Claude to pick up your resume…"}</b>
      <p class="meta" style="margin-top:8px">${late && p.status === "requested" ? "Is Claude's job-search session running? " : ""}The answer list opens by itself when it's done.</p></div>`;
  $("ansStatus").textContent = "";
}
async function showAnswerForm(msg) {
  ansButtons("form");
  $("ansSub").textContent = "Step 2 of 2 - review your answers. Leave anything blank: Claude asks you during an application and saves your answer then.";
  $("ansStatus").textContent = msg || "";
  $("ansBody").innerHTML = `<p class="meta">Loading questions…</p>`;
  try { renderAnswers((await api("/api/answers")).questions); }
  catch (e) { $("ansBody").innerHTML = `<p class="error">Could not load your answers: ${esc(e.message)}</p>`; }
}
function renderAnswers(qs) {
  state.answers = qs;
  const empty = qs.filter(q => !q.filled).length;
  const onlyEmpty = state.ansOnlyEmpty ?? empty > 0;
  const sections = [];
  qs.forEach(q => { if (!sections.includes(q.section)) sections.push(q.section); });
  const rows = sec => qs.filter(q => q.section === sec && (!onlyEmpty || !q.filled)).map(q => `
      <div class="ans-row ${q.filled ? "" : "empty"}">
        <label for="ans-${esc(q.key)}">${esc(q.question)}${q.filled ? "" : '<span class="tag">not answered</span>'}</label>
        <textarea id="ans-${esc(q.key)}" data-ans="${esc(q.key)}" rows="${q.value.length > 90 ? 3 : 1}">${esc(q.edited ?? q.value)}</textarea>
      </div>`).join("");
  $("ansBody").innerHTML = `
    <label class="inline" style="margin-bottom:6px"><input type="checkbox" id="ansOnlyEmpty" ${onlyEmpty ? "checked" : ""}>
      Show only unanswered (${empty} of ${qs.length})</label>
    ${sections.map(sec => { const r = rows(sec); return r ? `<div class="ans-sec"><h3>${esc(sec)}</h3>${r}</div>` : ""; }).join("")
      || '<p class="meta">Every question has an answer. Untick the box to review them.</p>'}`;
  $("ansOnlyEmpty").onchange = e => { collectAnswers(); state.ansOnlyEmpty = e.target.checked; renderAnswers(state.answers); };
}
function collectAnswers() {  // keep typed text when the list is re-rendered
  document.querySelectorAll("[data-ans]").forEach(t => {
    const q = state.answers.find(x => x.key === t.dataset.ans);
    if (q && t.value !== q.value) { q.edited = t.value; }
  });
}
async function saveAnswers() {
  collectAnswers();
  const answers = {};
  state.answers.forEach(q => { if (q.edited !== undefined && q.edited !== q.value) answers[q.key] = q.edited; });
  if (!Object.keys(answers).length) { $("ansStatus").textContent = "Nothing changed."; return; }
  $("ansSave").disabled = true;
  try {
    const r = await api("/api/answers", { answers });
    $("ansStatus").textContent = `Saved ${r.saved} answer${r.saved === 1 ? "" : "s"}.`;
    renderAnswers(r.questions);
  } catch (e) { $("ansStatus").textContent = "Save failed: " + e.message; }
  finally { $("ansSave").disabled = false; }
}
$("answersBtn").onclick = openAnswers;
$("ansSkip").onclick = () => showAnswerForm("");
$("ansBack").onclick = showResumeStep;
$("ansSave").onclick = saveAnswers;
$("ansClose").onclick = () => $("ansDlg").close();

async function load() {
  try { const d = await api("/api/jobs"); showError(""); apply(d); }
  catch (e) { showError("Cannot reach the job board server (" + e.message + "). Start it with: python jobboard.py"); }
}
load();
setInterval(load, 5000); // picks up Claude's progress (applying / submitted) and new feed runs
</script>
</body>
</html>
